// ====== WOORD-PLAATJE KOPPELEN ======
function maakWoordPlaatjeOefening() {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.appendChild(maakOefeningHeader("Woord-plaatje koppelen"));

  const info = document.createElement("div");
  info.className = "exercise-info";
  info.style.justifyContent = "center";
  info.style.marginBottom = "8px";
  const gekoppeld = oefenStaat.gekoppeld.length;
  const totaal = oefenStaat.items.length;
  info.innerHTML = `Gekoppeld: <strong>${gekoppeld} / ${totaal}</strong> &nbsp; Fouten: <strong style="color:var(--warn)">${oefenStaat.foutPogingen}</strong>`;
  panel.appendChild(info);

  const uitleg = document.createElement("p");
  uitleg.style.textAlign = "center";
  uitleg.style.color = "var(--muted)";
  uitleg.style.fontSize = "0.9em";
  uitleg.style.marginBottom = "12px";
  uitleg.textContent = "Klik eerst op een woord, dan op het bijbehorende plaatje.";
  panel.appendChild(uitleg);

  const gekozenWoord = oefenStaat.gekozenWoord || null;
  const gekozenPlaatje = oefenStaat.gekozenPlaatje || null;

  // Gemengde lijst: woorden links, plaatjes rechts
  const container = document.createElement("div");
  container.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:0 auto;";

  // Links: woorden
  const woordenCol = document.createElement("div");
  woordenCol.style.cssText = "display:flex;flex-direction:column;gap:8px;";
  const woordItems = shuffle(oefenStaat.items.map((it, i) => ({ ...it, idx: i })));

  woordItems.forEach(it => {
    const al = oefenStaat.gekoppeld.find(k => k.woord === it.woord);
    const btn = document.createElement("button");
    btn.textContent = it.woord;
    btn.style.cssText = `font-size:1.1em;padding:12px;border-radius:10px;border:2px solid ${al ? "var(--good)" : gekozenWoord === it.woord ? "var(--accent)" : "var(--border)"};background:${al ? "#c8e6c9" : gekozenWoord === it.woord ? "#fff3cd" : "var(--panel)"};cursor:${al ? "default" : "pointer"};`;
    if (!al) btn.onclick = () => {
      oefenStaat.gekozenWoord = it.woord;
      oefenStaat.gekozenPlaatje = null;
      render();
    };
    woordenCol.appendChild(btn);
  });

  // Rechts: plaatjes
  const plaatjesCol = document.createElement("div");
  plaatjesCol.style.cssText = "display:flex;flex-direction:column;gap:8px;";
  const plaatjeItems = shuffle(oefenStaat.items.map((it, i) => ({ ...it, idx: i })));

  plaatjesCol.appendChild(document.createElement("div")); // spacer
  plaatjeItems.forEach(it => {
    const al = oefenStaat.gekoppeld.find(k => k.plaatje === it.plaatje);
    const btn = document.createElement("button");
    btn.textContent = it.plaatje;
    btn.style.cssText = `font-size:2em;padding:8px;border-radius:10px;border:2px solid ${al ? "var(--good)" : gekozenPlaatje === it.plaatje ? "var(--accent)" : "var(--border)"};background:${al ? "#c8e6c9" : gekozenPlaatje === it.plaatje ? "#fff3cd" : "var(--panel)"};cursor:${al ? "default" : "pointer"};`;
    if (!al) btn.onclick = () => {
      if (!oefenStaat.gekozenWoord) return;
      // Controleer koppeling
      const juistItem = oefenStaat.items.find(x => x.woord === oefenStaat.gekozenWoord);
      if (juistItem && juistItem.plaatje === it.plaatje) {
        oefenStaat.gekoppeld.push({ woord: oefenStaat.gekozenWoord, plaatje: it.plaatje });
        geluidGoed(instellingen.geluidsEffecten);
        oefenStaat.goed = (oefenStaat.goed || 0) + 1;
      } else {
        geluidFout(instellingen.geluidsEffecten);
        oefenStaat.foutPogingen++;
      }
      oefenStaat.gekozenWoord = null;
      oefenStaat.gekozenPlaatje = null;
      render();
      if (oefenStaat.gekoppeld.length === oefenStaat.items.length) {
        // Klaar!
        setTimeout(() => {
          oefenStaat.goed = oefenStaat.items.length;
          oefenStaat.fout = oefenStaat.foutPogingen;
          voltooienOefening();
        }, 800);
      }
    };
    plaatjesCol.appendChild(btn);
  });

  container.appendChild(woordenCol);
  container.appendChild(plaatjesCol);
  panel.appendChild(container);
  return panel;
}

// ====== REEKS ONTHOUDEN ======
function maakReeksOnthoudenOefening() {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.appendChild(maakOefeningHeader("Reeks onthouden"));

  const info = document.createElement("div");
  info.className = "exercise-info";
  info.style.justifyContent = "center";
  info.innerHTML = `Ronde: <strong>${oefenStaat.ronde} / ${oefenStaat.aantalRondes}</strong> &nbsp; Goed: <strong style="color:var(--good)">${oefenStaat.goed}</strong>`;
  panel.appendChild(info);

  if (oefenStaat.toonFase) {
    // Toon de reeks
    const lbl = document.createElement("p");
    lbl.style.cssText = "text-align:center;font-size:1.1em;color:var(--muted);margin-bottom:12px;";
    lbl.textContent = "Onthoud deze reeks! Ze verdwijnt zo dadelijk…";
    panel.appendChild(lbl);

    const reeksDiv = document.createElement("div");
    reeksDiv.style.cssText = "display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0;";
    oefenStaat.reeks.forEach(sym => {
      const s = document.createElement("div");
      s.style.cssText = "font-size:3em;background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:12px 16px;";
      s.textContent = sym;
      reeksDiv.appendChild(s);
    });
    panel.appendChild(reeksDiv);

    const timer = document.createElement("p");
    timer.style.cssText = "text-align:center;color:var(--accent);font-size:1em;";
    timer.textContent = "Klaar? De reeks verdwijnt na 3 seconden.";
    panel.appendChild(timer);
  } else {
    // Invoerfase
    const lbl = document.createElement("p");
    lbl.style.cssText = "text-align:center;font-size:1.1em;margin-bottom:12px;";
    lbl.textContent = `Klik de reeks in de juiste volgorde (${oefenStaat.ingevoerd.length + 1} van ${oefenStaat.reeks.length}):`;
    panel.appendChild(lbl);

    // Ingevoerde reeks tonen
    const ingevoerdDiv = document.createElement("div");
    ingevoerdDiv.style.cssText = "display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;min-height:60px;";
    oefenStaat.ingevoerd.forEach(sym => {
      const s = document.createElement("div");
      s.style.cssText = "font-size:2em;background:#c8e6c9;border-radius:10px;padding:8px 12px;";
      s.textContent = sym;
      ingevoerdDiv.appendChild(s);
    });
    panel.appendChild(ingevoerdDiv);

    // Knoppen: alle symbolen in willekeurige volgorde
    const knoppen = shuffle([...new Set(oefenStaat.reeks)].concat(
      shuffle(REEKS_DATA[instellingen.moeilijkheid].items).filter(x => !oefenStaat.reeks.includes(x)).slice(0, 2)
    ));
    const grid = document.createElement("div");
    grid.style.cssText = "display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;";
    knoppen.forEach(sym => {
      const btn = document.createElement("button");
      btn.textContent = sym;
      btn.style.fontSize = "2em";
      btn.style.padding = "10px 14px";
      btn.onclick = () => {
        oefenStaat.ingevoerd.push(sym);
        const i = oefenStaat.ingevoerd.length - 1;
        if (sym !== oefenStaat.reeks[i]) {
          // Fout
          geluidFout(instellingen.geluidsEffecten);
          oefenStaat.fout++;
          // Toon uitleg en ga door
          oefenStaat.ingevoerd = [];
          const fb = document.createElement("div");
          fb.className = "feedback bad";
          fb.textContent = `✗ Fout! De reeks was: ${oefenStaat.reeks.join(" → ")}`;
          panel.appendChild(fb);
          setTimeout(() => volgendeReeksRonde(), 2000);
          grid.querySelectorAll("button").forEach(b => b.disabled = true);
          return;
        }
        if (oefenStaat.ingevoerd.length === oefenStaat.reeks.length) {
          // Helemaal goed!
          geluidGoed(instellingen.geluidsEffecten);
          oefenStaat.goed++;
          const fb = document.createElement("div");
          fb.className = "feedback good";
          fb.textContent = `✓ Correct! Goed gedaan!`;
          panel.appendChild(fb);
          setTimeout(() => volgendeReeksRonde(), 1500);
          grid.querySelectorAll("button").forEach(b => b.disabled = true);
          return;
        }
        render();
      };
      grid.appendChild(btn);
    });
    panel.appendChild(grid);
  }
  return panel;
}

function volgendeReeksRonde() {
  oefenStaat.ronde++;
  if (oefenStaat.ronde > oefenStaat.aantalRondes) {
    oefenStaat.items = [{goed: oefenStaat.goed, fout: oefenStaat.fout}];
    oefenStaat.index = 0;
    voltooienOefening();
    return;
  }
  const conf = REEKS_DATA[instellingen.moeilijkheid];
  oefenStaat.reeks = shuffle(conf.items).slice(0, conf.lengte);
  oefenStaat.ingevoerd = [];
  oefenStaat.toonFase = true;
  render();
  setTimeout(() => { if (oefenStaat && oefenStaat.toonFase) { oefenStaat.toonFase = false; render(); } }, 3000);
}

// ====== VOLGORDE ONTHOUDEN (Simon-stijl) ======
function maakVolgordeOefening() {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.appendChild(maakOefeningHeader("Volgorde onthouden"));

  const info = document.createElement("div");
  info.className = "exercise-info";
  info.style.justifyContent = "center";
  info.innerHTML = `Ronde: <strong>${oefenStaat.ronde} / ${oefenStaat.aantalRondes}</strong> &nbsp; Goed: <strong style="color:var(--good)">${oefenStaat.goed}</strong>`;
  panel.appendChild(info);

  if (oefenStaat.wacht) {
    const lbl = document.createElement("p");
    lbl.style.cssText = "text-align:center;font-size:1.1em;color:var(--muted);margin-bottom:16px;";
    lbl.textContent = "Even wachten…";
    panel.appendChild(lbl);
  } else if (oefenStaat.actieveKnop !== null) {
    const lbl = document.createElement("p");
    lbl.style.cssText = "text-align:center;font-size:1.1em;color:var(--accent);font-weight:bold;margin-bottom:16px;";
    lbl.textContent = "Let op de volgorde!";
    panel.appendChild(lbl);
  } else {
    const lbl = document.createElement("p");
    lbl.style.cssText = "text-align:center;font-size:1.1em;margin-bottom:16px;";
    lbl.textContent = `Klik de knoppen in dezelfde volgorde (stap ${oefenStaat.ingevoerd.length + 1} van ${oefenStaat.reeks.length}):`;
    panel.appendChild(lbl);
  }

  const grid = document.createElement("div");
  grid.style.cssText = "display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:16px auto;max-width:360px;";
  oefenStaat.knoppen.forEach((kleur, idx) => {
    const btn = document.createElement("button");
    const actief = oefenStaat.actieveKnop === idx;
    btn.style.cssText = `width:80px;height:80px;border-radius:16px;background:${actief ? "#fff" : kleur};border:4px solid ${kleur};font-size:1.3em;font-weight:bold;color:${actief ? kleur : "#fff"};text-shadow:${actief ? "none" : "0 1px 3px rgba(0,0,0,.5)"};transition:background 0.15s;cursor:${(oefenStaat.wacht || oefenStaat.actieveKnop !== null) ? "default" : "pointer"};`;
    btn.textContent = oefenStaat.knoppenLabels[idx];
    if (!oefenStaat.wacht && oefenStaat.actieveKnop === null) {
      btn.onclick = () => klikVolgordeKnop(idx);
    }
    grid.appendChild(btn);
  });
  panel.appendChild(grid);

  // Voortgangspunten
  const punten = document.createElement("div");
  punten.style.cssText = "display:flex;justify-content:center;gap:8px;margin-top:8px;";
  for (let i = 0; i < oefenStaat.reeks.length; i++) {
    const p = document.createElement("div");
    const kleur = i < oefenStaat.ingevoerd.length ? "var(--good)" : i === oefenStaat.ingevoerd.length ? "var(--accent)" : "var(--border)";
    p.style.cssText = `width:16px;height:16px;border-radius:50%;background:${kleur};`;
    punten.appendChild(p);
  }
  panel.appendChild(punten);
  return panel;
}

function maakVolgordeAnimatie() {
  if (!oefenStaat) return;
  let stap = 0;
  function toonVolgende() {
    if (stap >= oefenStaat.reeks.length) {
      oefenStaat.actieveKnop = null;
      render();
      return;
    }
    oefenStaat.actieveKnop = oefenStaat.reeks[stap];
    render();
    setTimeout(() => {
      oefenStaat.actieveKnop = null;
      render();
      stap++;
      setTimeout(toonVolgende, 400);
    }, 700);
  }
  setTimeout(toonVolgende, 500);
}

function klikVolgordeKnop(idx) {
  if (oefenStaat.toonFase || oefenStaat.wacht) return;
  oefenStaat.ingevoerd.push(idx);
  const pos = oefenStaat.ingevoerd.length - 1;
  if (oefenStaat.reeks[pos] !== idx) {
    // Fout
    geluidFout(instellingen.geluidsEffecten);
    oefenStaat.fout++;
    oefenStaat.wacht = true;
    const fb = document.createElement("div");
    fb.className = "feedback bad";
    fb.textContent = "✗ Fout! Probeer de volgende reeks.";
    document.querySelector(".panel").appendChild(fb);
    setTimeout(() => { oefenStaat.wacht = false; volgendeVolgordeRonde(); }, 1800);
    return;
  }
  if (oefenStaat.ingevoerd.length === oefenStaat.reeks.length) {
    geluidGoed(instellingen.geluidsEffecten);
    oefenStaat.goed++;
    oefenStaat.wacht = true;
    const fb = document.createElement("div");
    fb.className = "feedback good";
    fb.textContent = "✓ Correct!";
    document.querySelector(".panel").appendChild(fb);
    setTimeout(() => { oefenStaat.wacht = false; volgendeVolgordeRonde(); }, 1500);
    return;
  }
  render();
}

function volgendeVolgordeRonde() {
  oefenStaat.ronde++;
  if (oefenStaat.ronde > oefenStaat.aantalRondes) {
    oefenStaat.items = [{goed: oefenStaat.goed, fout: oefenStaat.fout}];
    oefenStaat.index = 0;
    voltooienOefening();
    return;
  }
  const conf = VOLGORDE_DATA[instellingen.moeilijkheid];
  oefenStaat.reeks = Array.from({length: conf.reeksLengte}, () => Math.floor(Math.random() * conf.aantalKnoppen));
  oefenStaat.ingevoerd = [];
  oefenStaat.actieveKnop = null;
  oefenStaat.wacht = false;
  render();
  setTimeout(() => maakVolgordeAnimatie(), 400);
}

// ====== STROOP-LIGHT (kleur benoemen) ======
function genereerStroopVraag() {
  const woord = STROOP_KLEUREN[Math.floor(Math.random() * STROOP_KLEUREN.length)];
  // Kleur van de letters is ANDERS dan het woord
  const andereKleuren = STROOP_KLEUREN.filter(k => k.naam !== woord.naam);
  const inktKleur = andereKleuren[Math.floor(Math.random() * andereKleuren.length)];
  oefenStaat.huidig = { woord, inktKleur };
  oefenStaat.antwoordGegeven = false;
}

function maakStroopOefening() {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.appendChild(maakOefeningHeader("Kleur benoemen"));

  const info = document.createElement("div");
  info.className = "exercise-info";
  info.style.justifyContent = "center";
  info.innerHTML = `Vraag: <strong>${oefenStaat.ronde + 1} / ${oefenStaat.aantalRondes}</strong> &nbsp; Goed: <strong style="color:var(--good)">${oefenStaat.score}</strong>`;
  panel.appendChild(info);

  const uitleg = document.createElement("p");
  uitleg.style.cssText = "text-align:center;color:var(--muted);font-size:0.95em;margin-bottom:8px;";
  uitleg.textContent = "Klik op de KLEUR van de letters — niet wat er staat!";
  panel.appendChild(uitleg);

  const woordDiv = document.createElement("div");
  woordDiv.style.cssText = `text-align:center;font-size:4em;font-weight:bold;color:${oefenStaat.huidig.inktKleur.kleur};margin:24px 0;padding:16px;background:var(--panel);border-radius:16px;border:2px solid var(--border);`;
  woordDiv.textContent = oefenStaat.huidig.woord.naam.toUpperCase();
  panel.appendChild(woordDiv);

  const vraagLabel = document.createElement("p");
  vraagLabel.style.cssText = "text-align:center;font-size:1.1em;font-weight:bold;margin-bottom:16px;";
  vraagLabel.textContent = "Welke kleur zie je?";
  panel.appendChild(vraagLabel);

  const grid = document.createElement("div");
  grid.style.cssText = "display:flex;flex-wrap:wrap;gap:12px;justify-content:center;";
  shuffle([...STROOP_KLEUREN]).forEach(k => {
    const btn = document.createElement("button");
    btn.style.cssText = `background:${k.kleur};color:#fff;font-size:1.1em;padding:14px 24px;border-radius:12px;border:none;min-width:100px;text-shadow:0 1px 2px rgba(0,0,0,.4);`;
    btn.textContent = k.naam;
    btn.disabled = oefenStaat.antwoordGegeven;
    btn.onclick = () => {
      if (oefenStaat.antwoordGegeven) return;
      oefenStaat.antwoordGegeven = true;
      const juist = k.naam === oefenStaat.huidig.inktKleur.naam;
      if (juist) { oefenStaat.score++; geluidGoed(instellingen.geluidsEffecten); }
      else { oefenStaat.fout++; geluidFout(instellingen.geluidsEffecten); }
      const fb = document.createElement("div");
      fb.className = `feedback ${juist ? "good" : "bad"}`;
      fb.textContent = juist ? `✓ Correct! De inktkleur was ${oefenStaat.huidig.inktKleur.naam}.` : `✗ Nee. De inktkleur was ${oefenStaat.huidig.inktKleur.naam}, niet "${oefenStaat.huidig.woord.naam}".`;
      panel.appendChild(fb);
      oefenStaat.ronde++;
      if (oefenStaat.ronde >= oefenStaat.aantalRondes) {
        setTimeout(() => {
          oefenStaat.goed = oefenStaat.score;
          oefenStaat.items = [{goed: oefenStaat.score}];
          oefenStaat.index = 0;
          voltooienOefening();
        }, 1500);
      } else {
        setTimeout(() => { genereerStroopVraag(); render(); }, 1500);
      }
    };
    grid.appendChild(btn);
  });
  panel.appendChild(grid);
  return panel;
}

// ====== RESULTATEN ======
function maakResultaten() {
  const panel = document.createElement("div");
  panel.className = "panel";
  const totaal = oefenStaat.goed + oefenStaat.fout;
  const pct = totaal > 0 ? Math.round((oefenStaat.goed / totaal) * 100) : 0;
  const tijd = Math.round((Date.now() - oefenStaat.startTijd) / 1000);

  const h = document.createElement("h1");
  h.textContent = "🎉 Oefening voltooid!";
  panel.appendChild(h);

  const stats = document.createElement("div");
  stats.className = "results-stats";
  stats.innerHTML = `
    <div class="stat-card"><div class="value">${oefenStaat.goed}</div><div class="label">Goed</div></div>
    <div class="stat-card"><div class="value">${oefenStaat.fout}</div><div class="label">Fout</div></div>
    <div class="stat-card"><div class="value">${pct}%</div><div class="label">Score</div></div>
  `;
  panel.appendChild(stats);

  const info = document.createElement("p");
  info.style.textAlign = "center";
  info.textContent = `Tijd: ${tijd} seconden | Niveau: ${["", "Makkelijk", "Gemiddeld", "Moeilijk"][instellingen.moeilijkheid]}`;
  panel.appendChild(info);

  const acties = document.createElement("div");
  acties.style.display = "flex";
  acties.style.gap = "12px";
  acties.style.justifyContent = "center";
  acties.style.marginTop = "24px";
  acties.style.flexWrap = "wrap";

  const opnieuw = document.createElement("button");
  opnieuw.className = "primary";
  opnieuw.textContent = "🔁 Nog een keer";
  opnieuw.onclick = () => { naarMenu(); startOefening(huidigeOefening); };
  acties.appendChild(opnieuw);

  const menu = document.createElement("button");
  menu.textContent = "🏠 Naar menu";
  menu.onclick = () => naarMenu();
  acties.appendChild(menu);

  panel.appendChild(acties);
  return panel;
}

// ====== PIN ======
function maakPinModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.style.maxWidth = "400px";
  modal.style.textAlign = "center";

  modal.innerHTML = `
    <h2>🔒 Therapeut-toegang</h2>
    <p>Voer de PIN-code in om instellingen te wijzigen.</p>
    <input type="password" class="pin-input" id="pinInput" maxlength="6">
    <p id="pinFout" style="color:var(--warn); height:24px; margin:8px 0"></p>
  `;
  const knoppen = document.createElement("div");
  knoppen.style.display = "flex";
  knoppen.style.gap = "12px";
  knoppen.style.justifyContent = "center";
  knoppen.style.marginTop = "16px";

  const ok = document.createElement("button");
  ok.className = "primary";
  ok.textContent = "Open";
  ok.onclick = checkPin;

  const annu = document.createElement("button");
  annu.textContent = "Annuleren";
  annu.onclick = () => { terug(); };

  knoppen.appendChild(ok);
  knoppen.appendChild(annu);
  modal.appendChild(knoppen);

  const hint = document.createElement("p");
  hint.style.marginTop = "16px";
  hint.style.fontSize = "0.85em";
  hint.style.color = "var(--muted)";
  hint.textContent = "Standaard PIN bij eerste keer: 1234";
  modal.appendChild(hint);

  overlay.appendChild(modal);
  setTimeout(() => {
    const inp = document.getElementById("pinInput");
    if (inp) {
      inp.focus();
      inp.onkeydown = (e) => { if (e.key === "Enter") checkPin(); };
    }
  }, 50);
  return overlay;
}

function checkPin() {
  const inp = document.getElementById("pinInput");
  if (!inp) return;
  if (inp.value === instellingen.pin) {
    huidigScherm = "instellingen";
    render();
  } else {
    const fout = document.getElementById("pinFout");
    if (fout) fout.textContent = "Onjuiste PIN-code";
    inp.value = "";
  }
}

// ====== INSTELLINGEN ======
function maakInstellingenModal() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  const modal = document.createElement("div");
  modal.className = "modal";

  const titel = document.createElement("h2");
  titel.textContent = "⚙️ Instellingen";
  modal.appendChild(titel);

  const intro = document.createElement("p");
  intro.style.color = "var(--muted)";
  intro.style.fontSize = "0.9em";
  intro.textContent = "Wijzigingen worden automatisch opgeslagen.";
  modal.appendChild(intro);

  function rij(label, sub, control) {
    const r = document.createElement("div");
    r.className = "setting-row";
    const lab = document.createElement("div");
    lab.className = "setting-label";
    lab.innerHTML = `<strong>${label}</strong>${sub ? `<small>${sub}</small>` : ""}`;
    const ctrl = document.createElement("div");
    ctrl.className = "setting-control";
    ctrl.appendChild(control);
    r.appendChild(lab); r.appendChild(ctrl);
    return r;
  }

  const moeilijkSel = document.createElement("select");
  ["Makkelijk", "Gemiddeld", "Moeilijk"].forEach((l, i) => {
    const o = document.createElement("option"); o.value = i + 1; o.textContent = l;
    if (instellingen.moeilijkheid === i + 1) o.selected = true;
    moeilijkSel.appendChild(o);
  });
  moeilijkSel.onchange = (e) => { instellingen.moeilijkheid = parseInt(e.target.value); bewaarInstellingen(instellingen); };
  modal.appendChild(rij("Moeilijkheidsgraad", "Niveau van de oefeningen", moeilijkSel));

  const tekstSel = document.createElement("select");
  [["normaal", "Normaal"], ["large", "Groot"], ["xlarge", "Extra groot"]].forEach(([v, l]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = l;
    if (instellingen.tekstgrootte === v) o.selected = true;
    tekstSel.appendChild(o);
  });
  tekstSel.onchange = (e) => { instellingen.tekstgrootte = e.target.value; bewaarInstellingen(instellingen); render(); };
  modal.appendChild(rij("Tekstgrootte", "Voor mensen met visuele beperking", tekstSel));

  modal.appendChild(rij("Hoog contrast", "Zwart-wit voor extra leesbaarheid",
    maakSwitch(instellingen.hoogContrast, (v) => { instellingen.hoogContrast = v; bewaarInstellingen(instellingen); render(); })));

  modal.appendChild(rij("Spraak (uitspreken)", "Woorden en zinnen worden voorgelezen",
    maakSwitch(instellingen.spraak, (v) => { instellingen.spraak = v; bewaarInstellingen(instellingen); })));

  modal.appendChild(rij("Geluidseffecten", "Geluid bij goed/fout antwoord",
    maakSwitch(instellingen.geluidsEffecten, (v) => { instellingen.geluidsEffecten = v; bewaarInstellingen(instellingen); })));

  const tijdSel = document.createElement("select");
  [[0, "Uit"], [15, "15 seconden"], [30, "30 seconden"], [60, "60 seconden"], [120, "2 minuten"]].forEach(([v, l]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = l;
    if (instellingen.tijdsLimiet === v) o.selected = true;
    tijdSel.appendChild(o);
  });
  tijdSel.onchange = (e) => { instellingen.tijdsLimiet = parseInt(e.target.value); bewaarInstellingen(instellingen); };
  modal.appendChild(rij("Tijdslimiet per vraag", "Tijd voordat vraag wordt overgeslagen", tijdSel));

  modal.appendChild(rij("Automatisch doorgaan", "Volgende vraag verschijnt vanzelf",
    maakSwitch(instellingen.autoVolgende, (v) => { instellingen.autoVolgende = v; bewaarInstellingen(instellingen); })));

  const vertSel = document.createElement("select");
  [1, 2, 3, 4, 5].forEach(v => {
    const o = document.createElement("option"); o.value = v; o.textContent = `${v} seconde${v > 1 ? "n" : ""}`;
    if (instellingen.autoVolgendeVertraging === v) o.selected = true;
    vertSel.appendChild(o);
  });
  vertSel.onchange = (e) => { instellingen.autoVolgendeVertraging = parseInt(e.target.value); bewaarInstellingen(instellingen); };
  modal.appendChild(rij("Wachttijd tussen vragen", "Hoe lang feedback zichtbaar blijft", vertSel));

  const aantInp = document.createElement("input");
  aantInp.type = "number"; aantInp.min = 3; aantInp.max = 30;
  aantInp.value = instellingen.vragenPerSessie;
  aantInp.onchange = (e) => {
    const v = Math.max(3, Math.min(30, parseInt(e.target.value) || 10));
    instellingen.vragenPerSessie = v; e.target.value = v; bewaarInstellingen(instellingen);
  };
  modal.appendChild(rij("Aantal vragen per sessie", "Tussen 3 en 30", aantInp));

  modal.appendChild(rij("Typ-modus", "Bij Welk woord / Zinnen: typen i.p.v. kiezen",
    maakSwitch(instellingen.typModus, (v) => { instellingen.typModus = v; bewaarInstellingen(instellingen); })));

  modal.appendChild(rij("Foute antwoorden herhalen", "Aan het einde van de sessie",
    maakSwitch(instellingen.herhaalFouten, (v) => { instellingen.herhaalFouten = v; bewaarInstellingen(instellingen); })));

  modal.appendChild(rij("Voortgang bijhouden", "Resultaten lokaal opslaan",
    maakSwitch(instellingen.voortgangBijhouden, (v) => { instellingen.voortgangBijhouden = v; bewaarInstellingen(instellingen); })));

  const pinKnop = document.createElement("button");
  pinKnop.textContent = "🔑 PIN-code wijzigen";
  pinKnop.onclick = () => {
    const nieuw = prompt("Nieuwe PIN-code (4-6 cijfers):", instellingen.pin);
    if (nieuw && /^\d{4,6}$/.test(nieuw)) {
      instellingen.pin = nieuw; bewaarInstellingen(instellingen);
      alert("PIN-code gewijzigd.");
    } else if (nieuw !== null) {
      alert("PIN moet 4 tot 6 cijfers zijn.");
    }
  };
  const wissenKnop = document.createElement("button");
  wissenKnop.textContent = "🗑️ Statistieken wissen";
  wissenKnop.onclick = () => {
    if (confirm("Alle opgeslagen voortgang verwijderen?")) {
      localStorage.removeItem("oefenapp_stats");
      alert("Statistieken gewist.");
    }
  };
  const resetKnop = document.createElement("button");
  resetKnop.textContent = "↺ Standaardinstellingen";
  resetKnop.onclick = () => {
    if (confirm("Alle instellingen terugzetten naar standaard?")) {
      instellingen = { ...STANDAARD_INSTELLINGEN };
      bewaarInstellingen(instellingen);
      render();
    }
  };

  const beheerRij = document.createElement("div");
  beheerRij.style.display = "flex";
  beheerRij.style.gap = "8px";
  beheerRij.style.flexWrap = "wrap";
  beheerRij.style.marginTop = "20px";
  beheerRij.style.paddingTop = "20px";
  beheerRij.style.borderTop = "2px solid var(--border)";
  beheerRij.appendChild(pinKnop);
  beheerRij.appendChild(wissenKnop);
  beheerRij.appendChild(resetKnop);
  modal.appendChild(beheerRij);

  const stats = laadStats();
  if (stats.sessies && stats.sessies.length > 0) {
    const statTitel = document.createElement("h3");
    statTitel.style.marginTop = "24px";
    statTitel.textContent = "📊 Statistieken";
    modal.appendChild(statTitel);

    const perType = {};
    stats.sessies.forEach(s => {
      perType[s.type] = perType[s.type] || { aantal: 0, goed: 0, fout: 0 };
      perType[s.type].aantal++;
      perType[s.type].goed += s.goed || 0;
      perType[s.type].fout += s.fout || 0;
    });
    const labels = {
      woord: "Welk woord", benoemen: "Benoemen", letterkiezen: "Letter kiezen",
      letterinvullen: "Letter invullen", lettergreep: "Lettergreep", watpast: "Wat past",
      watpastniet: "Wat past niet", synoniem: "Synoniem", zinnen: "Zinnen aanvullen",
      geheugen: "Geheugen", aandacht: "Aandacht", geld: "Geld"
    };
    Object.entries(perType).forEach(([type, d]) => {
      const p = document.createElement("p");
      p.style.margin = "4px 0";
      const totaal = d.goed + d.fout;
      const pct = totaal > 0 ? Math.round((d.goed / totaal) * 100) : 0;
      p.innerHTML = `<strong>${labels[type] || type}:</strong> ${d.aantal} sessies${totaal > 0 ? `, gemiddeld ${pct}% goed` : ""}`;
      modal.appendChild(p);
    });
  }

  const sluitRij = document.createElement("div");
  sluitRij.style.marginTop = "24px";
  sluitRij.style.textAlign = "right";
  const sluit = document.createElement("button");
  sluit.className = "primary";
  sluit.textContent = "Sluiten";
  sluit.onclick = () => naarMenu();
  sluitRij.appendChild(sluit);
  modal.appendChild(sluitRij);

  overlay.appendChild(modal);
  return overlay;
}

function maakSwitch(checked, onChange) {
  const lbl = document.createElement("label");
  lbl.className = "switch";
  const inp = document.createElement("input");
  inp.type = "checkbox"; inp.checked = checked;
  inp.onchange = (e) => onChange(e.target.checked);
  const sl = document.createElement("span");
  sl.className = "slider";
  lbl.appendChild(inp); lbl.appendChild(sl);
  return lbl;
}

// ====== START ======
render();

</script>
</body>
</html>
